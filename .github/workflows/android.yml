name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          # launcher icons from our artwork
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b0f1a' --assetPath assets || true
          npx cap sync android
          # permissions for reminders (notifications, vibration, exact alarms)
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS VIBRATE SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KanwarReminders.apk
      - uses: actions/upload-artifact@v4
        with: { name: KanwarReminders-apk, path: KanwarReminders.apk }
      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Kanwar Reminders (latest Android APK)
          body: Install KanwarReminders.apk on Android (allow "install unknown apps" for your browser/files app).
          files: KanwarReminders.apk
          make_latest: true
